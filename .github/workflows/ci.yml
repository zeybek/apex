name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validators (py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 scripts/validate_package.py
      - run: python3 scripts/validate_distribution.py

  test:
    name: Tests + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: pytest -q --cov=scripts --cov-report=term-missing
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Coverage"
            echo
            coverage report --format=markdown 2>/dev/null || coverage report
          } >> "$GITHUB_STEP_SUMMARY"
      - run: ruff check scripts tests
      - run: ruff format --check scripts tests
      - run: mypy scripts tests

  official:
    name: Official skills-ref validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: make validate-official

  schema:
    name: Eval JSON Schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Validate eval files against their schemas
        run: |
          uvx check-jsonschema --schemafile schemas/trigger-evals.schema.json plugins/apex/skills/*/evals/trigger-evals.json
          uvx check-jsonschema --schemafile schemas/evals.schema.json plugins/apex/skills/*/evals/evals.json
      - name: Validate benchmark files when present
        run: |
          shopt -s globstar nullglob
          files=(benchmarks/**/*.json)
          if [ ${#files[@]} -gt 0 ]; then
            uvx check-jsonschema --schemafile schemas/benchmark.schema.json "${files[@]}"
          else
            echo "No benchmark files yet; skipping."
          fi
      - name: Validate a generated trigger report against its schema
        run: |
          python3 scripts/run_evals.py trigger --skill apex-design --client stub --runs 1 --out trigger-report.json
          uvx check-jsonschema --schemafile schemas/trigger-report.schema.json trigger-report.json

  eval-smoke:
    name: Eval harness smoke (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run the harness via the offline stub client (no model)
        run: |
          for skill in plugins/apex/skills/*/; do
            name=$(basename "$skill")
            python3 scripts/run_evals.py trigger --skill "$name" --client stub --runs 1
            python3 scripts/run_evals.py output --skill "$name" --client stub --dry-run
          done

  dco:
    name: DCO sign-off
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require Signed-off-by on human-authored commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          while IFS= read -r sha; do
            author=$(git log -1 --format='%an <%ae>' "$sha")
            case "$author" in
              *"[bot]"*|*"github-actions"*|*"dependabot"*) continue ;;
            esac
            if ! git log -1 --format='%B' "$sha" | grep -qE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::commit $sha by $author has no Signed-off-by trailer (git commit -s)"
              missing=1
            fi
          done < <(git rev-list "$BASE".."$HEAD")
          exit $missing

  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npx --yes markdownlint-cli2
